name: first_workflow
on: push
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Start workflow
        run: echo "Hello, World!"
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'        # Eclipse Temurin (recommended)
          java-version: '17'            # or '17.x'
          cache: 'maven'                # enable maven dependency caching
          cache-dependency-path: pom.xml
      - name: Run tests
        run: mvn test
        
